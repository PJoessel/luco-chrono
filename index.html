<style>
:root {
  --noir: #000;
  --rouge: #e10600;
  --jaune: #ffd400;
  --blanc: #fff;
  --gris: #2a2a2a;
  /* couleurs d'état, volontairement douces */
  --gris-clair: #8f8f8f;
  --bleu: #8ab4dc;
  --rouge-doux: #e06a60;
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
html, body {
  height: 100%;
  margin: 0;
  background: var(--noir);
  color: var(--blanc);
  font-family: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  /* pas de zoom quand on tape vite deux fois (+ et −) ; le zoom à deux doigts reste possible */
  touch-action: manipulation;
}
body { display: flex; flex-direction: column; container-type: size; }
/* Chaque écran est un conteneur : les tailles en cqw/cqh suivent l'écran (largeur limitée et centrée sur tablette et ordi) */
.screen { flex: 1; display: none; flex-direction: column; width: 100%; max-width: 560px; align-self: center; padding: 16px 18px; min-height: 0; container-type: size; }
.screen.on { display: flex; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible { outline: 4px solid var(--jaune); outline-offset: 3px; }

/* ---------- Écran de chargement ---------- */
#splash {
  position: fixed;
  inset: 0;
  z-index: 30;
  background: var(--noir);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4cqh;
  transition: opacity .45s;
}
#splash.out { opacity: 0; pointer-events: none; }
#splash h2 {
  margin: 0;
  text-align: center;
  font-size: min(30cqw, 22cqh);
  font-weight: 800;
  line-height: .9;
  letter-spacing: .02em;
  color: var(--blanc);
}
#splash h2 span { display: block; color: var(--jaune); }
#splash i {
  display: block;
  width: 40cqw;
  max-width: 260px;
  height: 8px;
  background: var(--gris);
  border-radius: 4px;
  overflow: hidden;
}
#splash i::after {
  content: "";
  display: block;
  height: 100%;
  width: 100%;
  background: var(--rouge);
  transform-origin: left;
  animation: ld .4s linear forwards;
}
@keyframes ld { from { transform: scaleX(0); } to { transform: scaleX(1); } }

/* ---------- Réglages ---------- */
h1 { margin: 4px 0 14px; text-align: center; font-size: clamp(30px, 10cqw, 44px); font-weight: 600; color: var(--jaune); letter-spacing: .02em; }
.rows { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; }
.row { display: flex; flex-direction: column; gap: 12px; }
.row > span { font-size: clamp(22px, 7.5cqw, 30px); font-weight: 600; color: var(--blanc); text-align: center; }
.ctl { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.ctl .v {
  flex: 1;
  text-align: center;
  font-size: clamp(64px, 22cqw, 120px);
  font-weight: 800;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  /* les chiffres de la police tombent 0,05em sous le centre : on les remonte au niveau des cercles */
  transform: translateY(-.05em);
}
.step {
  width: 20cqw;
  max-width: 96px;
  aspect-ratio: 1;
  border: 4px solid var(--jaune);
  border-radius: 50%;
  position: relative;
  color: var(--jaune);
  touch-action: manipulation;
}
.step:active { background: var(--jaune); color: var(--noir); }
/* + et − dessinés en CSS : centrés au pixel près dans le cercle (le caractère de la police tombait trop bas) */
.step::before, .step::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  width: 38%;
  height: 6px;
  border-radius: 3px;
  background: currentColor;
  transform: translate(-50%, -50%);
}
.step::after { transform: translate(-50%, -50%) rotate(90deg); }
.step[data-d^="-"]::after { display: none; }
.go {
  margin-top: 12px;
  padding: 18px;
  background: var(--jaune);
  color: var(--noir);
  font-size: clamp(44px, 14cqw, 72px);
  font-weight: 800;
  border-radius: 18px;
  letter-spacing: .03em;
}
.go:active { filter: brightness(.85); }

/* ---------- Chrono ----------
   Une couleur par état (data-etat sur #run) :
   blanc = combat, rouge doux = fin, bleu doux = repos, gris = pause. Le jaune est pour les boutons. */
#run { --etat: var(--blanc); }
#run[data-etat="paused"] { --etat: var(--gris-clair); }
#run[data-etat="repos"] { --etat: var(--bleu); }
#run[data-etat="between"], #run[data-etat="done"] { --etat: var(--rouge-doux); }

.top { font-size: clamp(24px, 7cqw, 40px); font-weight: 600; }
.top b { font-weight: 800; }
.mid { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; }
#msg {
  min-height: 1.1em;
  font-size: clamp(30px, 9cqw, 48px);
  font-weight: 800;
  line-height: 1.1;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--etat);
  text-align: center;
}
#digits {
  font-size: min(52cqw, 34cqh);
  font-weight: 800;
  line-height: .95;
  font-variant-numeric: tabular-nums;
  color: var(--etat);
  transition: color .15s;
}
#digits.alerte { color: var(--rouge-doux); }
#run[data-etat="paused"] #digits { animation: clignote 1.6s ease-in-out infinite; }
@keyframes clignote { 50% { opacity: .55; } }
#sous { min-height: 1.2em; font-size: clamp(24px, 7cqw, 40px); font-weight: 600; line-height: 1.2; text-align: center; color: var(--gris-clair); }
.bar { height: 10px; background: var(--gris); border-radius: 5px; overflow: hidden; margin: 6px 0 14px; }
.bar i { display: block; height: 100%; width: 0; background: var(--etat); }
.actions { display: flex; gap: 12px; }
/* hauteur fixe : les boutons ne bougent pas quand leur texte change */
.actions button { flex: 1; height: 2.3em; padding: 0 8px; font-size: clamp(34px, 10cqw, 56px); font-weight: 800; line-height: 1.1; border-radius: 16px; }
#bPause {
  position: relative;
  overflow: hidden;
  background: var(--jaune);
  color: var(--noir);
  -webkit-touch-callout: none;
  touch-action: none;
}
#bPause small { display: block; font-size: .4em; font-weight: 600; line-height: 1; }
/* Appui long pendant le repos : une ombre remplit le bouton en 1 s */
#bPause::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, .3);
  transform: scaleX(0);
  transform-origin: left;
}
#bPause.appui::before { transform: scaleX(1); transition: transform 1s linear; }
#bStop { flex: .56; border: 4px solid var(--rouge); color: var(--rouge); }
#bStop:active { background: var(--rouge); color: var(--blanc); }
/* assaut fini : plus rien à arrêter */
#run[data-etat="done"] #bStop { display: none; }

/* ---------- Confirmation d'arrêt ---------- */
#conf {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: rgba(0, 0, 0, .94);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
#conf.on { display: flex; }
#conf .box { width: 100%; max-width: 520px; text-align: center; }
#conf p { font-size: clamp(36px, 10cqw, 60px); font-weight: 800; margin: 0 0 24px; line-height: 1.05; }
#cNon { background: var(--jaune); color: var(--noir); }
#cOui { background: var(--rouge); color: var(--blanc); }

/* ---------- Variantes ---------- */
@media (prefers-reduced-motion: reduce) {
  #splash { transition: none; }
  #splash i::after { animation: none; }
  #run[data-etat="paused"] #digits { animation: none; }
}
/* Toujours en portrait : si le téléphone est tourné, la page tourne dans
   l'autre sens et reste collée au téléphone (classes posées par orienter()).
   Les tailles sont en cqw/cqh (taille du body) pour rester les mêmes une fois tourné. */
html.tourne-g, html.tourne-d { overflow: hidden; }
html.tourne-g body, html.tourne-d body {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vh;
  width: 100dvh;
  height: 100vw;
  height: 100dvw;
  transform-origin: top left;
  /* l'encoche est en haut du téléphone, donc en haut de la page tournée */
  padding-top: max(env(safe-area-inset-left, 0px), env(safe-area-inset-right, 0px));
}
html.tourne-g body { transform: translateY(100dvh) rotate(-90deg); }
html.tourne-d body { transform: translateX(100dvw) rotate(90deg); }
</style>
</head>

  <div class="rows">
    <div class="row">
      <span>Nombre de reprises</span>
      <div class="ctl">
        <button class="step" data-k="n" data-d="-1" aria-label="Moins de reprises"></button>
        <div class="v" id="vN">3</div>
        <button class="step" data-k="n" data-d="1" aria-label="Plus de reprises"></button>
      </div>
    </div>
    <div class="row">
      <span>Durée d’une reprise</span>
      <div class="ctl">
        <button class="step" data-k="d" data-d="-30" aria-label="Réduire de 30 secondes"></button>
        <div class="v" id="vD">2:00</div>
        <button class="step" data-k="d" data-d="30" aria-label="Allonger de 30 secondes"></button>
      </div>
    </div>
    <div class="row">
      <span>Repos entre les reprises</span>
      <div class="ctl">
        <button class="step" data-k="r" data-d="-30" aria-label="Raccourcir le repos de 30 secondes"></button>
        <div class="v" id="vR">1:00</div>
        <button class="step" data-k="r" data-d="30" aria-label="Allonger le repos de 30 secondes"></button>
      </div>
    </div>
  </div>
  <button class="go" id="bGo">Lancer</button>
</section>

<!-- Chrono -->
<section class="screen" id="run" data-etat="setup">
  <div class="top" id="rInfo"></div>
  <div class="mid">
    <div id="msg"></div>
    <div id="digits">2:00</div>
    <div id="sous"></div>
  </div>
  <div class="bar"><i id="prog"></i></div>
  <div class="actions">
    <button id="bStop">Arrêter</button>
    <button id="bPause">Pause</button>
  </div>
</section>

<!-- Confirmation d'arrêt -->
<div id="conf">
  <div class="box">
    <p>Arrêter l’assaut et revenir aux réglages ?</p>
    <div class="actions">
      <button id="cNon">Continuer</button>
      <button id="cOui">Arrêter</button>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);

  /* ---------- Réglages ---------- */

  const CLE = "chrono-canne";
  const TEST = 10; // durée de test : on y arrive en baissant sous 30 s, jamais sauvée
  // n = nombre de reprises, d = durée d'une reprise, r = repos entre deux reprises
  // (en secondes ; r = 0 : pas de repos, on enchaîne à la main)
  const S = { n: 3, d: 120, r: 60 };

  try {
    const o = JSON.parse(localStorage.getItem(CLE));
    if (o && o.n) {
      S.n = +o.n || S.n;
      // anciennes sauvegardes : minutes (m) et secondes (s) séparées
      S.d = +o.d || (+o.m || 0) * 60 + (+o.s || 0) || S.d;
      if (Number.isFinite(+o.r)) S.r = +o.r;
    }
  } catch (e) {}

  const ordinal = (n) => (n === 1 ? "1re" : n + "e");
  const fmt = (t) => Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0");

  function borner() {
    S.n = Math.min(20, Math.max(1, S.n));
    if (S.d !== TEST) S.d = Math.min(180, Math.max(30, Math.round(S.d / 30) * 30));
    S.r = Math.min(180, Math.max(0, Math.round(S.r / 30) * 30));
  }

  function afficherReglages() {
    borner();
    $("vN").textContent = S.n;
    $("vD").textContent = fmt(S.d);
    $("vR").textContent = S.r ? fmt(S.r) : "Non";
    try {
      if (S.d !== TEST) localStorage.setItem(CLE, JSON.stringify(S));
    } catch (e) {}
  }

  document.querySelectorAll(".step").forEach((b) => {
    b.addEventListener("click", () => {
      const delta = parseInt(b.dataset.d, 10);
      if (b.dataset.k === "n") {
        S.n += delta;
      } else if (b.dataset.k === "r") {
        S.r += delta;
      } else if (delta < 0) {
        S.d = S.d <= 30 ? TEST : S.d - 30;
      } else {
        S.d = S.d < 30 ? 30 : S.d + 30;
      }
      afficherReglages();
    });
  });

  /* ---------- Sons (fabriqués en Web Audio, aucun fichier) ---------- */

  let ac = null;

  // Le navigateur n'autorise le son qu'après un geste de l'utilisateur
  function debloquerSon() {
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state !== "running") ac.resume();
    } catch (e) {}
  }

  // Une note qui monte vite puis s'éteint (de vol*0 à vol en `attaque` s, puis vers 0 en `duree` s)
  function note(freq, type, vol, attaque, duree, sortie, debut) {
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, debut);
    g.gain.linearRampToValueAtTime(vol, debut + attaque);
    g.gain.exponentialRampToValueAtTime(0.0001, debut + duree);
    o.connect(g);
    g.connect(sortie);
    o.start(debut);
    o.stop(debut + duree + 0.05);
    return o;
  }

  // Cloche : fondamentale + harmoniques qui s'éteignent plus vite.
  // `decalage` : nombre de secondes avant le coup
  function cloche(freq, duree, vol, decalage) {
    if (!ac) return;
    try {
      const t = ac.currentTime + (decalage || 0);
      [[1, 1], [2.76, .55], [5.4, .3], [8.93, .15]].forEach(([r, v], i) => {
        note(freq * r, "sine", vol * v, .004, duree / (1 + i * .7), ac.destination, t);
      });
    } catch (e) {}
  }

  // 5 dernières secondes : un ding par seconde
  const bip = () => cloche(1100, .8, .3);

  // Fin de reprise : trois dings plus graves et plus forts
  function sonnerieFin() {
    [0, .4, .8].forEach((d) => cloche(880, 1.6, .5, d));
  }

  // Départ automatique après le repos : deux dings aigus
  function depart() {
    cloche(1500, 1, .35);
    cloche(1500, 1.2, .35, .18);
  }

  // Petit clic sur chaque bouton
  function clic() {
    if (!ac) return;
    try {
      const t = ac.currentTime;
      const o = note(420, "sine", .22, .002, .06, ac.destination, t);
      o.frequency.setValueAtTime(420, t);
      o.frequency.exponentialRampToValueAtTime(200, t + .04);
    } catch (e) {}
  }

  document.addEventListener("click", (e) => {
    if (e.target.closest && e.target.closest("button")) {
      debloquerSon();
      clic();
    }
  }, true);

  function vibrer(motif) {
    try { navigator.vibrate && navigator.vibrate(motif); } catch (e) {}
  }

  /* ---------- Écran gardé allumé ---------- */

  let verrou = null;
  let demande = false; // une demande est en cours : on n'en lance pas une deuxième

  async function garderAllume() {
    if (!navigator.wakeLock || verrou || demande) return;
    demande = true;
    try {
      const v = await navigator.wakeLock.request("screen");
      v.addEventListener("release", () => { if (verrou === v) verrou = null; });
      // l'assaut a pu se finir pendant la demande
      if (etat === "setup" || etat === "done") v.release();
      else verrou = v;
    } catch (e) {}
    demande = false;
  }

  function laisserEteindre() {
    try { verrou && verrou.release(); } catch (e) {}
    verrou = null;
  }

  // En revenant dans l'app : le verrou d'écran a sauté, et sur iPhone le son a pu être coupé
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible") return;
    if (ac && ac.state !== "running") ac.resume().catch(() => {});
    if (etat !== "setup" && etat !== "done") garderAllume();
  });

  /* ---------- Chrono ----------
     États : setup (réglages), run (combat), paused, repos (repos chronométré),
     between (reprise finie, sans repos réglé), done (assaut fini).
     L'état est recopié dans #run[data-etat] : le CSS en tire les couleurs. */

  let etat = "setup";
  let reprise = 1;
  let resteMs = 0;     // temps restant au moment de la pause
  let finA = 0;        // heure de fin de la reprise ou du repos (Date.now) : pas de dérive
  let dureeEnCours = 0; // durée de ce qui tourne (reprise ou repos), en secondes
  let derniereSec = null;
  let minuteur = null;

  // Début de ce qui suit : pile à la fin de ce qui vient de finir, sauf si l'app
  // était en veille (plus de 2 s de retard) : on repart de maintenant, sans rattrapage
  const suite = () => (Date.now() - finA < 2000 ? finA : Date.now());

  function changerEtat(e) {
    etat = e;
    $("run").dataset.etat = e;
  }

  // Fin d'assaut : ce qui a été fait
  const recap = () => S.n + (S.n > 1 ? " reprises" : " reprise") + " de " + fmt(S.d);

  function montrer(id) {
    ["setup", "run"].forEach((s) => $(s).classList.toggle("on", s === id));
  }

  function chiffres(texte, classe) {
    const d = $("digits");
    d.textContent = texte;
    d.className = classe || "";
  }

  function boutonJaune(texte) {
    const b = $("bPause");
    b.textContent = texte;
    b.classList.remove("appui");
  }

  function demarrerReprise(debut = Date.now()) {
    changerEtat("run");
    resteMs = S.d * 1000;
    derniereSec = null;
    dureeEnCours = S.d;
    $("rInfo").innerHTML = "<b>" + ordinal(reprise) + "</b> reprise / " + S.n;
    $("msg").textContent = "";
    $("sous").textContent = "";
    boutonJaune("Pause");
    $("prog").style.width = "0%";
    finA = debut + resteMs;
    lancerMinuteur();
  }

  function demarrerRepos() {
    changerEtat("repos");
    derniereSec = null;
    dureeEnCours = S.r;
    $("rInfo").innerHTML = "Ensuite : <b>" + ordinal(reprise + 1) + "</b> reprise / " + S.n;
    $("msg").textContent = "Repos";
    $("sous").textContent = "";
    $("bPause").innerHTML = "Lancer<small>appui long</small>";
    $("prog").style.width = "0%";
    finA = suite() + S.r * 1000;
    lancerMinuteur();
  }

  function finirRepos() {
    clearInterval(minuteur);
    depart();
    vibrer(300);
    reprise++;
    demarrerReprise(suite());
  }

  function lancerMinuteur() {
    clearInterval(minuteur);
    tic();
    minuteur = setInterval(tic, 100);
  }

  function tic() {
    const reste = finA - Date.now();
    if (reste <= 0) {
      if (etat === "repos") finirRepos();
      else finirReprise();
      return;
    }
    const sec = Math.ceil(reste / 1000);
    if (sec !== derniereSec) {
      derniereSec = sec;
      if (sec <= 5) bip();
      chiffres(fmt(sec), sec <= 5 ? "alerte" : "");
    }
    $("prog").style.width = (100 - reste / (dureeEnCours * 10)) + "%";
  }

  function finirReprise() {
    clearInterval(minuteur);
    sonnerieFin();
    vibrer([400, 150, 400]);
    $("prog").style.width = "100%";
    chiffres("0:00");

    if (reprise >= S.n) {
      changerEtat("done");
      $("msg").textContent = "Terminé";
      $("sous").textContent = recap();
      boutonJaune("Nouvel assaut");
      laisserEteindre();
    } else if (S.r) {
      demarrerRepos();
    } else {
      changerEtat("between");
      $("msg").textContent = "Fin";
      $("sous").textContent = "";
      boutonJaune("Lancer la " + ordinal(reprise + 1));
    }
  }

  function retourReglages() {
    clearInterval(minuteur);
    reprise = 1;
    resteMs = 0;
    derniereSec = null;
    $("sous").textContent = "";
    $("msg").textContent = "";
    laisserEteindre();
    changerEtat("setup");
    montrer("setup");
  }

  function mettreEnPause() {
    resteMs = finA - Date.now();
    clearInterval(minuteur);
    changerEtat("paused");
    boutonJaune("Reprendre");
    $("msg").textContent = "Pause";
  }

  function reprendre() {
    changerEtat("run");
    $("msg").textContent = "";
    boutonJaune("Pause");
    finA = Date.now() + resteMs;
    lancerMinuteur();
  }

  /* ---------- Boutons ---------- */

  $("bGo").addEventListener("click", () => {
    reprise = 1;
    montrer("run");
    garderAllume();
    demarrerReprise();
  });

  // Pendant le repos, il faut garder le doigt 1 s sur « Lancer » : pas de départ par erreur
  let minuteurAppui = null;
  let ignorerClic = false; // le clic qui suit un appui long réussi ne compte pas

  function debutAppui() {
    ignorerClic = false;
    if (etat !== "repos") return;
    $("bPause").classList.add("appui");
    minuteurAppui = setTimeout(() => {
      ignorerClic = true;
      clearInterval(minuteur);
      reprise++;
      demarrerReprise();
    }, 1000);
  }

  function finAppui() {
    clearTimeout(minuteurAppui);
    $("bPause").classList.remove("appui");
  }

  $("bPause").addEventListener("pointerdown", debutAppui);
  $("bPause").addEventListener("contextmenu", (e) => e.preventDefault());
  ["pointerup", "pointerleave", "pointercancel"].forEach((t) => $("bPause").addEventListener(t, finAppui));

  // Le gros bouton jaune change de rôle selon l'état
  $("bPause").addEventListener("click", () => {
    if (ignorerClic) {
      ignorerClic = false;
      return;
    }
    if (etat === "run") mettreEnPause();
    else if (etat === "paused") reprendre();
    else if (etat === "between") {
      reprise++;
      demarrerReprise();
    }
    else if (etat === "done") retourReglages();
    // repos : un simple appui ne fait rien, voir l'appui long
  });

  $("bStop").addEventListener("click", () => $("conf").classList.add("on"));
  $("cNon").addEventListener("click", () => $("conf").classList.remove("on"));
  $("cOui").addEventListener("click", () => {
    $("conf").classList.remove("on");
    retourReglages();
  });

  /* ---------- Toujours en portrait ----------
     Angle du téléphone : 90 = tourné vers la gauche, -90 ou 270 = vers la droite.
     Sur ordi (angle 0), on ne tourne rien. */

  function orienter() {
    const angle = typeof window.orientation === "number"
      ? window.orientation
      : (screen.orientation ? screen.orientation.angle : 0);
    const paysage = innerWidth > innerHeight;
    const html = document.documentElement;
    html.classList.toggle("tourne-g", paysage && angle === 90);
    html.classList.toggle("tourne-d", paysage && (angle === -90 || angle === 270));
  }

  window.addEventListener("resize", orienter);
  window.addEventListener("orientationchange", orienter);
  orienter();

  /* ---------- Hors ligne ----------
     Sur un vrai site (pas en ouvrant le fichier), sw.js garde l'app en mémoire
     sur le téléphone : elle marche ensuite en mode avion. */

  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }

  /* ---------- Démarrage ---------- */

  afficherReglages();
  setTimeout(() => {
    const s = $("splash");
    s.classList.add("out");
    setTimeout(() => { s.style.display = "none"; }, 500);
  }, 500);
})();
</script>
</body>
</html>
