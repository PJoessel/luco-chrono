# Vérifie chaque Pull Request avant qu'on la fusionne dans main (et donc avant la mise en ligne).
name: Vérification

on:
  pull_request:
    branches: [main]

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Script de l'app sans erreur de syntaxe
        run: |
          sed -n '/^<script>/,/^<\/script>/p' index.html | sed '1d;$d' > /tmp/app.js
          test -s /tmp/app.js || { echo "Script introuvable dans index.html"; exit 1; }
          node --check /tmp/app.js

      - name: sw.js sans erreur de syntaxe
        run: node --check sw.js

      - name: Manifeste valide
        run: node -e 'JSON.parse(require("fs").readFileSync("manifest.webmanifest", "utf8"))'

      - name: Fichiers du cache hors ligne présents
        run: |
          for f in $(grep -oE '"\./[^"]+"' sw.js | tr -d '"'); do
            [ "$f" = "./" ] && continue
            test -f "$f" || { echo "Fichier listé dans sw.js mais absent : $f"; exit 1; }
          done

      - name: VERSION changée si l'app est modifiée
        run: |
          base="origin/${{ github.base_ref }}"
          if git diff --quiet "$base"...HEAD -- index.html sw.js manifest.webmanifest icons; then
            echo "L'app n'est pas modifiée."
            exit 0
          fi
          avant=$(git show "$base:sw.js" | grep -oE 'luco-chrono-[0-9]+' | head -1)
          apres=$(grep -oE 'luco-chrono-[0-9]+' sw.js | head -1)
          if [ "$avant" = "$apres" ]; then
            echo "L'app est modifiée mais VERSION est toujours $apres dans sw.js : les téléphones ne recevraient pas la mise à jour."
            exit 1
          fi
          echo "VERSION : $avant -> $apres"
